name: Release

on:
  push:
    tags: ["v*"]

permissions:
  attestations: write
  id-token: write
  contents: write

jobs:
  github:
    uses: tree-sitter/workflows/.github/workflows/release.yml@dca539e07998ac429e185349d3dd194d2c7418d3 # main
    with:
      generate: true
      attestations: true

  crates:
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@dca539e07998ac429e185349d3dd194d2c7418d3 # main
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    with:
      generate: true

  npm:
    uses: tree-sitter/workflows/.github/workflows/package-npm.yml@dca539e07998ac429e185349d3dd194d2c7418d3 # main
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    with:
      generate: true

  pypi:
    uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@dca539e07998ac429e185349d3dd194d2c7418d3 # main
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    with:
      generate: true
